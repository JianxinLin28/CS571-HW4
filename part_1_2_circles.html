<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <svg id="chart" width="500" height="150"></svg>

  <script>
    const data = [
      { label: "Last Semester", area: 1200, x: 50 },
      { label: "Current Semester", area: 2300, x: 200 }
    ];

    const svg = d3.select("#chart");
    const cy = 50;

    svg.selectAll("circle")
      .data(data)
      .join("circle")
      .attr("cx", d => d.x)
      .attr("cy", cy)
      .attr("r", d => Math.sqrt(d.area / Math.PI))
      .attr("fill", "steelblue")
      .attr("opacity", 0.7);

    svg.selectAll("text")
      .data(data)
      .join("text")
      .attr("x", d => d.x)
      .attr("y", 150)
      .attr("text-anchor", "middle")
      .text(d => d.label);
    
      const svgString = new XMLSerializer()
        .serializeToString(svg.node());

    const blob = new Blob([svgString], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);

    const img = new Image();

    img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = 400;
        canvas.height = 150;

        const ctx = canvas.getContext("2d");

        // White background
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.drawImage(img, 0, 0);

        canvas.toBlob(pngBlob => {
            if (!pngBlob) return;

            const link = document.createElement("a");
            link.href = URL.createObjectURL(pngBlob);
            link.download = "part1_2-circles.png";
            link.click();

            URL.revokeObjectURL(link.href);
            URL.revokeObjectURL(url);
        }, "image/png");
    };

    img.src = url;
  </script>
</body>
</html>
