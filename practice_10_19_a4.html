<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <svg id="chart" width="400" height="300"></svg>
  <script>
    const data = [20, 40, 60];

    const svg = d3.select("#chart");

    const x = d3.scaleLinear()
      .domain([20, 60])
      .range([0, 280]);

    const g = svg.append("g")
      .attr("transform", "translate(50, 0)")

    g.selectAll("rect")
      .data(data)
      .join("rect")
      .attr("x", d => x(d))
      .attr("y", d => 50-d)
      .attr("width", 40)
      .attr("height", d => d);

</script>
</body>
</html>
